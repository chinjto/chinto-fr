<section class="hero">
  <p class="eyebrow"><a [routerLink]="['/blog']">&lt;&lt; Les articles de Chinto</a></p>
  <h1>{{article()?.title}}</h1>

  <p class="intro">
    {{article()?.summary}}
  </p>
  <p></p>
  <div class="tags">
    @for(tag of tags(article()); track tag){
    <span class="tag">{{tag}}</span>
    }
  </div>
  <p></p>
</section>

<section [innerHTML]="article()?.content | markdown">
</section>
